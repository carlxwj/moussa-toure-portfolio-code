name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install reproducible dependencies
        run: npm ci
      - name: Unit and static tests
        run: npm test
      - name: TypeScript validation
        run: npm run typecheck
      - name: Verify production build (demo data only)
        run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Firestore rules against local emulator
        run: npx firebase emulators:exec --only firestore --project demo-moussa "npm run test:rules"
      - name: Check for obvious secrets
        run: python3 scripts/scan-secrets.py
